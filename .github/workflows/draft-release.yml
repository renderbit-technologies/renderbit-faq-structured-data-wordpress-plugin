name: Draft Release on Tag

on:
  push:
    tags:
      - "v*.*.*"

# The release step creates or edits a GitHub release, which needs write access.
permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get tag version
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.1"

      # The plugin has no runtime Composer dependencies, so the zip is built from tracked files only
      # (see .gitattributes for what is excluded) and no `composer install` is needed.
      - name: Build plugin zip
        run: composer build-zip

      - name: Verify zip contents
        run: composer check-zip

      - name: Create GitHub Release (draft) and upload zip
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: true
          generate_release_notes: true
          files: renderbit-faq-structured-data.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
